<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AmigosdeDios</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="chat-view">

  <main class="chat-page">
    <!-- Encabezado Minimalista -->
    <header class="chat-header">
      <h1>AmigosdeDios</h1>
    </header>

    <!-- Área Central -->
    <section class="chat-body">
      <div class="brand-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>100% Anónimo</span>
      </div>
    </section>

    <!-- Barra de Chat Inferior -->
    <footer class="chat-footer">
      <form id="messageForm" class="chat-input-wrapper">
        <textarea
          id="messageInput"
          class="chat-textarea"
          rows="1"
          placeholder="Escribe un mensaje anónimo..."
          maxlength="2000"
          required
        ></textarea>
        <button type="submit" id="sendBtn" class="send-btn" title="Enviar mensaje" disabled>
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>
      <div class="input-hints">
        <span>Presiona Enter para enviar</span>
        <span id="charCounter">0 / 2000</span>
      </div>
    </footer>
  </main>

  <!-- Modal de Confirmación -->
  <div id="confirmModal" class="modal-overlay" aria-hidden="true" role="dialog">
    <div class="modal-box">
      <h2 class="modal-title">¿Confirmar envío?</h2>
      <p class="modal-description">
        Tu mensaje será enviado de manera completamente anónima. No podrás editarlo ni borrarlo una vez enviado.
      </p>
      <div id="modalPreview" class="modal-preview"></div>
      <div class="modal-actions">
        <button type="button" id="cancelModalBtn" class="btn-secondary">Cancelar</button>
        <button type="button" id="confirmSendBtn" class="btn-primary">Confirmar y Enviar</button>
      </div>
    </div>
  </div>

  <!-- Notificación Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
    <span id="toastMessage">Mensaje enviado con éxito</span>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
